<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>OG-Bild</title>
  <!-- Vorlage für public/og.png: npm run og (Dev-Server muss laufen). Keine Orte A/B. -->
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    body { display: grid; grid-template-columns: 430px 1fr; }
    .text { background: #14532d; color: #fff; padding: 56px 44px; display: flex; flex-direction: column; }
    .logo { width: 64px; height: 64px; margin-bottom: 28px; }
    h1 { font-size: 64px; line-height: 1; margin: 0 0 18px; letter-spacing: -0.02em; }
    p { font-size: 25px; line-height: 1.35; margin: 0; color: #dcfce7; }
    ul { list-style: none; padding: 0; margin: auto 0 0; display: grid; gap: 8px; font-size: 20px; color: #bbf7d0; }
    li::before { content: '●'; color: #4ade80; margin-right: 10px; }
    /* Ganzzahliger Zoom: gebrochene Zoomstufen erzeugen helle Fugen zwischen den Kacheln */
    .mapcell { overflow: hidden; }
    #map { width: 100%; height: 100%; }
    .leaflet-control-attribution { font-size: 11px !important; }
  </style>
</head>
<body>
  <div class="text">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#16a34a"/><path d="M16 6 5 11.5 16 17l9-4.5V19h2v-7.5z" fill="#fff"/><path d="M9.5 15.3v4.2c0 1.9 2.9 3.5 6.5 3.5s6.5-1.6 6.5-3.5v-4.2L16 18.6z" fill="#fff" opacity=".85"/></svg>
    <h1>Schulkarte</h1>
    <p>Weiterführende Schulen im Berliner Südosten – passend zu zwei Wohnorten.</p>
    <ul id="facts"></ul>
  </div>
  <div class="mapcell"><div id="map"></div></div>
  <script type="module">
    import L from 'leaflet';
    import 'leaflet/dist/leaflet.css';
    const geo = await (await fetch('/schulen.geojson')).json();
    const termine = (await import('../data/termine.json')).default;
    const pts = geo.features.filter((f) => f.properties.Bezirk !== 'Brandenburg').map((f) => [f.geometry.coordinates[1], f.geometry.coordinates[0]]);
    const map = L.map('map', { zoomControl: false, attributionControl: true, zoomSnap: 1 });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap-Mitwirkende' }).addTo(map);
    map.fitBounds(L.latLngBounds(pts), { padding: [30, 30] });
    for (const p of pts) L.circleMarker(p, { radius: 8, weight: 2.5, color: '#14532d', fillColor: '#16a34a', fillOpacity: 0.95 }).addTo(map);
    document.getElementById('facts').innerHTML = [
      `${geo.features.length} Schulen mit Fahrzeiten`,
      'Abitur, Nachfrage, Kosten',
      `${termine.length} Termine zum Übernehmen`,
    ].map((t) => `<li>${t}</li>`).join('');
  </script>
</body>
</html>
